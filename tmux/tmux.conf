# ~/.config/tmux/tmux.conf – managed by github.com/edxleon/dotfiles
# No plugins – everything here is built into tmux ≥ 3.2.
# Local overrides: ~/.config/tmux/local.conf (not tracked)

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB,xterm-ghostty:RGB"   # true colour
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10          # default since 3.5; older tmux (Debian 12: 3.3) waits 500 ms
set -g focus-events on
set -g status-interval 5
set -g display-time 2000
set -g display-panes-time 2000
setw -g monitor-activity on
set -g visual-activity off
setw -g aggressive-resize on
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

# ── Prefix: Ctrl+Space ────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Reload / edit config ──────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind e new-window -n "local.conf" \
    "sh -c '\${EDITOR:-vim} ~/.config/tmux/local.conf && tmux source ~/.config/tmux/tmux.conf && tmux display \"Config reloaded\"'"

# ── Splits: v side by side, h stacked – as in the owner's Windows/WSL setup ────
# | and - work too; tmux defaults % and " still work. (On a German Mac layout | is Option+7,
# which Terminal sends as Meta, so v/h are the reliable ones.)
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation: Alt+hjkl, vim-aware (pairs with vim-tmux-navigator) ──────
# macOS Terminal: Settings → Profiles → Keyboard → "Use Option as Meta key".
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"
# Without Meta: prefix + arrow keys (tmux default) – prefix h is the stacked split above.

# ── Resize panes ────────────────────────────────────────────────────────────────
# Ctrl+Alt+h/j/k/l without prefix (hold to keep resizing) – mirrors Alt+hjkl for moving.
# Terminal sends ESC + Ctrl-letter (Option as Meta); in zsh that steals only ESC ^H
# (an alternative "delete word back" – Alt/Ctrl+Backspace still do that).
bind -n C-M-h resize-pane -L 2
bind -n C-M-j resize-pane -D 1
bind -n C-M-k resize-pane -U 1
bind -n C-M-l resize-pane -R 2
# Also: prefix + Shift+H/J/K/L (5 cells, repeatable: prefix H H H …); tmux defaults
# prefix + Ctrl/Alt+arrows (on macOS Ctrl+↑/↓ belong to Mission Control); mouse: drag the border.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Windows: Alt+1…9 ──────────────────────────────────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── Copy mode (vi keys) → system clipboard ────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel
set -g set-clipboard on         # OSC 52 for terminals that support it
if-shell 'command -v pbcopy'   'set -s copy-command "pbcopy"'
if-shell 'command -v clip.exe' 'set -s copy-command "clip.exe"'
if-shell 'command -v wl-copy'  'set -s copy-command "wl-copy"'
if-shell '! command -v wl-copy && command -v xclip' 'set -s copy-command "xclip -selection clipboard"'

# ── Mouse (prefix m toggles) ──────────────────────────────────────────────────
set -g mouse on
bind m set -g mouse \; display "Mouse #{?mouse,on,off}"

# ── Look: Gruvbox dark, rounded pills on a transparent bar (needs a Nerd Font) ─
# bg #282828  bg1 #3c3836  bg2 #504945  gray #928374  fg #ebdbb2  fg0 #fbf1c7
# yellow #d79921  orange #d65d0e  aqua #689d6a  blue #458588
# A pill is:  (cap in pill colour on default bg) + text on pill colour + 
set -g status-style        "bg=default,fg=#ebdbb2"
set -g status-justify      left
set -g status-left-length  40
set -g status-right-length 80
set -g window-status-separator ""

# Session pill: orange, turns yellow while the prefix key is pressed
set -g status-left "#[fg=#{?client_prefix,#d79921,#d65d0e},bg=default]#[fg=#fbf1c7,bg=#{?client_prefix,#d79921,#d65d0e},bold] #S#[fg=#{?client_prefix,#d79921,#d65d0e},bg=default,nobold] "

# Windows: active = yellow pill, others = plain grey text; 󰊓 = zoomed pane
setw -g window-status-format         "#[fg=#928374,bg=default]  #I #W#{?window_zoomed_flag, 󰊓,}  "
setw -g window-status-current-format "#[fg=#d79921,bg=default]#[fg=#282828,bg=#d79921,bold]#I #W#{?window_zoomed_flag, 󰊓,}#[fg=#d79921,bg=default,nobold]"
setw -g window-status-activity-style "fg=#d65d0e"
setw -g window-status-bell-style     "fg=#fb4934"

# Right: time pill (aqua) + host pill (blue)
set -g status-right "#[fg=#689d6a,bg=default]#[fg=#fbf1c7,bg=#689d6a] %H:%M#[fg=#689d6a,bg=default] #[fg=#458588,bg=default]#[fg=#fbf1c7,bg=#458588]󰒋 #h#[fg=#458588,bg=default]"

# Panes, messages, popups
set -g pane-border-lines        single
set -g pane-border-style        "fg=#3c3836"
set -g pane-active-border-style "fg=#d79921"
set -g popup-border-lines       rounded
set -g popup-border-style       "fg=#d79921"
set -g message-style            "bg=default,fg=#d79921,bold"
set -g message-command-style    "bg=default,fg=#83a598"
set -g mode-style               "bg=#504945,fg=#fbf1c7"

if-shell "[ -f ~/.config/tmux/local.conf ]" "source ~/.config/tmux/local.conf"
