# ~/.config/tmux/tmux.conf – managed by github.com/edxleon/dotfiles
# Local overrides: ~/.config/tmux/local.conf (not tracked)

# ── General ───────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -g default-shell "$SHELL"
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10
set -g focus-events on
set -g set-clipboard on
set -g status-interval 5
set -g display-time 2000
set -g display-panes-time 2000
setw -g monitor-activity on
set -g visual-activity off
set -g set-titles on
set -g set-titles-string '#h ❐ #S ● #I #W'

# ── Prefix: Ctrl+Space ────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Reload / edit config ──────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"
bind e new-window -n "local.conf" \
    "sh -c '\${EDITOR:-vim} ~/.config/tmux/local.conf && tmux source ~/.config/tmux/tmux.conf && tmux display \"Config reloaded\"'"

# ── Splits (v = side by side, h = stacked), keep current path ─────────────────
unbind '"'
unbind %
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# ── Pane navigation: Alt+hjkl, vim-aware (pairs with vim-tmux-navigator) ──────
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind -n M-h if-shell "$is_vim" "send-keys M-h" "select-pane -L"
bind -n M-j if-shell "$is_vim" "send-keys M-j" "select-pane -D"
bind -n M-k if-shell "$is_vim" "send-keys M-k" "select-pane -U"
bind -n M-l if-shell "$is_vim" "send-keys M-l" "select-pane -R"

# ── Swap panes ────────────────────────────────────────────────────────────────
bind -n M-W swap-pane -U
bind -n M-S swap-pane -D

# ── Window switching: Alt+1…9 ─────────────────────────────────────────────────
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ── Vi copy mode ──────────────────────────────────────────────────────────────
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v      send-keys -X begin-selection
bind -T copy-mode-vi y      send-keys -X copy-pipe-and-cancel
bind -T copy-mode-vi Escape send-keys -X cancel

# ── Mouse (prefix m toggles) ──────────────────────────────────────────────────
set -g mouse on
bind m set -g mouse \; display "Mouse #{?mouse,on,off}"

# ── Gruvbox dark (matches starship.toml and vim) ──────────────────────────────
# bg #282828  bg1 #3c3836  bg3 #665c54  fg #ebdbb2  gray #928374
# yellow #d79921  orange #d65d0e  aqua #689d6a  blue #458588  red #cc241d
set -g status-style        "bg=#3c3836,fg=#ebdbb2"
set -g status-left-length  40
set -g status-right-length 60
set -g status-left  "#[bg=#d65d0e,fg=#fbf1c7,bold] #S #[bg=#3c3836,fg=#d65d0e,nobold] "
set -g status-right "#{?client_prefix,#[fg=#d79921]⌨ ,}#[fg=#928374]%H:%M  %d %b #[bg=#689d6a,fg=#fbf1c7] #H "

setw -g window-status-format         "#[fg=#928374] #I #W "
setw -g window-status-current-format "#[bg=#d79921,fg=#282828,bold] #I #W "
setw -g window-status-activity-style "fg=#d65d0e"

set -g pane-border-style        "fg=#665c54"
set -g pane-active-border-style "fg=#d79921"
set -g message-style            "bg=#d79921,fg=#282828,bold"
set -g message-command-style    "bg=#3c3836,fg=#d79921"
set -g mode-style               "bg=#458588,fg=#fbf1c7"

# ── Plugins (tpm, installed by install.sh) ────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

if-shell "[ -f ~/.config/tmux/local.conf ]" "source ~/.config/tmux/local.conf"

# tpm must be the last line
run '~/.config/tmux/plugins/tpm/tpm'
